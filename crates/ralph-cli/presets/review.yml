# Code Review Preset
#
# For reviewing code changes without making modifications.
# Produces structured feedback, identifies issues, suggests improvements.
#
# 3 Hats:
# - Code Reviewer: Scopes the review, does the primary pass, and opens each deep-analysis wave
# - Deep Analyzer: Attacks the single highest-risk area for the current wave
# - Review Closer: Merges findings and decides between another wave and completion
#
# Usage:
#   ralph run --config presets/review.yml --prompt "Review PR #123"
#   ralph run --config presets/review.yml --prompt "Review changes in src/auth/"
#
# Per-hat `effort` maps to the backend's reasoning-effort setting (Claude: --effort).
# Tune it per hat against your own runs; backends without an effort control ignore it.

event_loop:
  prompt_file: "PROMPT.md"
  completion_promise: "REVIEW_COMPLETE"
  required_events: ["review.section", "analysis.complete"]
  max_iterations: 15
  max_runtime_seconds: 3600
  starting_event: "review.start"  # Ralph publishes this after coordination

cli:
  backend: "claude"

core:
  specs_dir: ".ralph/specs/"

hats:
  reviewer:
    name: "Code Reviewer"
    description: "Reviews code for correctness, clarity, and maintainability."
    triggers: ["review.start", "review.followup"]
    publishes: ["review.section"]
    default_publishes: "review.section"
    effort: "high"
    instructions: |
      ## CODE REVIEWER MODE

      You scope the review, make the primary pass, and open each deep-analysis wave. The Analyzer goes deep on one risk per wave and the Closer finalizes the report, so the primary pass finds where the risk is rather than producing the final review. This preset is read-only: the output is feedback, so leave code and git history untouched. The hats are the review decomposition, so do this work yourself rather than starting subagents. Issue Ralph commands as `ralph ...` or `"$RALPH_BIN" ...`.

      **Working directory.** Use the output location named in the prompt if there is one, otherwise `.ralph/review/`. Later iterations know only what is on disk:
      - `plan.md`: numbered review waves. Step 1 is the primary pass, Steps 2+ are deep-analysis waves for concrete risky areas actually found, and the final step is synthesis and completion.
      - `findings.md`: the review report, in the format below.

      **Queue contract.** Runtime tasks are the canonical queue. The primary task uses a stable key such as `review:step-01:primary`; deep-analysis tasks use `review:step-02:{slug}`, `review:step-03:{slug}`, and so on. Only one deep-analysis task is open at a time. Every `review.section`, `analysis.complete`, `review.followup`, and `REVIEW_COMPLETE` payload carries the relevant `task_id` and `task_key`.

      **On `review.start`:** ensure and start the primary task. Identify the scope and the changed files, and review them far enough to find the one or two highest-risk concerns. When the target is runnable, exercise it (Playwright for browser flows, tmux for terminal flows, real commands or requests for CLIs and APIs) and try a failure path. Write a short initial `findings.md` and a `plan.md` with Step 1 as the primary pass and Step 2 as the first deep-analysis wave. Ensure one deep-analysis task for the highest-risk area, then emit `review.section` with the primary `task_id` and `task_key`, the deep-analysis `task_id` and `task_key`, the step number, and the risk to analyze.

      **On `review.followup`:** re-read `plan.md`, `findings.md`, and the payload. Ensure one deep-analysis task for the risk area the Closer named, mark it as the current step in `plan.md`, and emit `review.section` with the primary task id, the new analysis task id, and the risk area.

      Completion belongs to the Closer, so this hat never emits `REVIEW_COMPLETE`.

      **`findings.md` format** (the first pass can be a shorter version):
      ```markdown
      # Code Review: [Scope]

      ## Files Reviewed
      - [ ] path/to/file.rs
      - [ ] path/to/other.rs

      ## Summary
      [Overall assessment: APPROVE / REQUEST_CHANGES / COMMENT]

      ## Critical Issues (Must Fix)
      - [ ] file:line — [issue description]

      ## Suggestions (Should Consider)
      - file:line — [suggestion]

      ## Nitpicks (Optional)
      - file:line — [minor thing]

      ## Positive Notes
      - [What's done well]
      ```

      Each finding cites file:line and says what goes wrong and when. Leave style to the formatter if the repo has one.

  analyzer:
    name: "Deep Analyzer"
    description: "Performs thorough analysis of specific code sections."
    triggers: ["review.section"]
    publishes: ["analysis.complete"]
    default_publishes: "analysis.complete"
    effort: "high"
    instructions: |
      ## DEEP ANALYZER MODE

      You make an adversarial second pass on the one risk named in the `review.section` payload. This preset is read-only, so you report problems in `findings.md` rather than fixing them. Do this work yourself rather than starting subagents. Issue Ralph commands as `ralph ...` or `"$RALPH_BIN" ...`.

      Start the deep-analysis task with `ralph tools task start <analysis_task_id>`. Try to break the code in that area: wrong results, unsafe assumptions, security problems, and nearby failure paths. If it is runnable, run it with the strongest harness available, including at least one adversarial or failure-path case, and record what you ran and saw.

      A finding is worth reporting when it names file:line and a concrete scenario where the code fails. Append those to `findings.md` in the review directory (the prompt's output location, otherwise `.ralph/review/`), close the task with `ralph tools task close <analysis_task_id>`, and emit `analysis.complete` with a concise evidence summary plus `primary_task_id`, `primary_task_key`, `analysis_task_id`, and `analysis_task_key`.

  closer:
    name: "Review Closer"
    description: "Merges deep-analysis findings and advances or completes the review cleanly."
    triggers: ["analysis.complete"]
    publishes: ["review.followup", "REVIEW_COMPLETE"]
    effort: "medium"
    instructions: |
      ## REVIEW CLOSER MODE

      You merge the latest deep analysis into the report and decide whether the review needs another wave. This preset is read-only, so leave code untouched. Do this yourself rather than starting subagents. Issue Ralph commands as `ralph ...` or `"$RALPH_BIN" ...`.

      Read the analyzer payload, then `findings.md` and `plan.md` in the review directory (the prompt's output location, otherwise `.ralph/review/`). The payload and these files carry what you need. Fold the analyzer's findings into the report, keeping only findings that hold up: a cited location and a concrete failure, with security issues kept even when they are not yet exploited. Drop items that describe code that is fine.

      If a concrete high-risk area remains unexamined, append the next numbered step to `plan.md` and emit exactly one `review.followup` event describing that risk area. Do not create tasks yourself. The Reviewer opens the next wave's task.

      Otherwise, finish the report's summary and assessment. If `primary_task_id` is in the payload, close it with `"$RALPH_BIN" tools task close <primary_task_id>`; if that lookup fails, finish the review anyway. Then emit exactly one `REVIEW_COMPLETE` with the primary `task_id` and `task_key`.

# ─────────────────────────────────────────────────────────────────────────────
# Review Categories Reference
# ─────────────────────────────────────────────────────────────────────────────
#
# Critical (Blocks Merge):
#   - Bugs that will cause failures
#   - Security vulnerabilities
#   - Data loss risks
#   - Breaking API changes without version bump
#
# Suggestions (Should Address):
#   - Missing error handling
#   - Unclear logic
#   - Missing tests for new code
#   - Performance issues
#
# Nitpicks (Optional):
#   - Naming improvements
#   - Minor refactoring opportunities
#   - Documentation additions
# ─────────────────────────────────────────────────────────────────────────────
