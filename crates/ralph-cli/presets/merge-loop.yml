# Merge Loop Preset
#
# Merges completed parallel loop from worktree back to main branch.
# Designed to run automatically after worktree loops complete, resolving
# conflicts via AI and verifying with tests.
#
# This preset reads the RALPH_MERGE_LOOP_ID environment variable to
# identify which loop to merge. If not set, reads from the prompt.
#
# Usage (automatic, via auto-merge):
#   After a worktree loop completes, Ralph spawns:
#   RALPH_MERGE_LOOP_ID=a3f2 ralph run --preset builtin:merge-loop
#
# Usage (manual):
#   ralph run --preset builtin:merge-loop -p "Merge loop ralph-20250124-a3f2"

event_loop:
  prompt: |
    Merge the completed Ralph loop back to the main branch.

    ## Context
    - Check RALPH_MERGE_LOOP_ID environment variable for loop ID
    - Or extract loop ID from this prompt if provided
    - Loop branch format: ralph/{loop_id}
    - Worktree location: .worktrees/{loop_id}

    ## Your Task
    Safely merge the loop's changes into the main branch, ensuring all tests pass.
  completion_promise: "MERGE_COMPLETE"
  max_iterations: 15
  max_runtime_seconds: 1800
  starting_event: "merge.start"

cli:
  backend: "auto"

core:
  specs_dir: ".ralph/specs/"

hats:
  merger:
    name: "Branch Merger"
    description: "Performs git merge with conflict resolution and test verification."
    triggers: ["merge.start", "tests.passed"]
    publishes: ["merge.done", "conflict.detected", "merge.failed"]
    default_publishes: "merge.done"
    effort: "medium"
    instructions: |
      ## BRANCH MERGER MODE

      Merge the completed Ralph loop branch into main. The Resolver handles conflicts, the Tester verifies resolved merges, and the Cleaner removes the worktree afterwards.

      ### Step 1: Identify the loop

      Read the loop ID from the environment:
      ```bash
      echo $RALPH_MERGE_LOOP_ID
      ```

      If it is not set, take the loop ID from the prompt (format: ralph-YYYYMMDD-HHMMSS-XXXX). The branch to merge is `ralph/{loop_id}`. If you cannot identify the branch, publish `merge.failed` instead of guessing, because merging the wrong branch is hard to undo.

      ### Step 2: Review the changes

      ```bash
      git diff main...ralph/{loop_id} --stat
      git log main..ralph/{loop_id} --oneline
      ```

      ### Step 3: Write the commit message

      Use this conventional commit format:
      ```
      merge(ralph): <summary> (loop <id>)
      ```

      The summary is one line describing what the loop accomplished, based on the diff stat and commit log above. Keep the whole subject line at 72 characters or fewer. Examples:
      - `merge(ralph): add user auth module (loop ralph-20250124-a3f2)`
      - `merge(ralph): fix memory leak in worker (loop ralph-20250124-b5c9)`

      ### Step 4: Merge

      ```bash
      git checkout main
      git merge ralph/{loop_id} --no-ff -m "merge(ralph): <summary> (loop {loop_id})"
      ```

      `--no-ff` creates an explicit merge commit carrying your message.

      **If the merge succeeds with no conflicts,** run the test suite:
      ```bash
      cargo test
      ```
      If tests pass, publish `merge.done` with the merge commit SHA. If they fail, the cause is usually a subtle incompatibility between the two sides: make the smallest fix, re-run tests until they pass, commit the fix, and then publish `merge.done`.

      **If there are conflicts,** publish `conflict.detected` with the list of conflicted files and a short description of each conflict type (for example, "both modified same function").

      **On `tests.passed`,** the Resolver's merge commit has been verified by the Tester; publish `merge.done` with the merge commit SHA.

      Keep the merge to the loop's changes; leave unrelated changes out. Never force-push or rewrite history, because main is shared and other loops merge into it.

      When the merge is complete and tests pass, output: MERGE_COMPLETE

  resolver:
    name: "Conflict Resolver"
    description: "Resolves merge conflicts by understanding intent of both sides."
    triggers: ["conflict.detected"]
    publishes: ["conflict.resolved", "conflict.unresolvable"]
    effort: "medium"
    instructions: |
      ## CONFLICT RESOLVER MODE

      Resolve the merge conflicts so that the intent of both sides survives.

      ### Process

      1. List the conflicted files:
         ```bash
         git status --short | grep "^UU"
         ```

      2. For each file, read the conflict markers:
         - `<<<<<<< HEAD`: main branch version
         - `=======`: separator
         - `>>>>>>> ralph/{id}`: loop branch version

         Work out what each side was trying to do, then resolve:
         - Independent features: keep both.
         - Overlapping features: merge the logic carefully.
         - Directly contradictory changes: prefer the loop's intent, since it is newer.

         Understand code before deleting it, and avoid resolving a conflict by picking one side wholesale without checking what the other side needed. Leave no conflict markers behind.

      3. Mark each file resolved:
         ```bash
         git add <file>
         ```

      4. After all conflicts are resolved, commit with the same conventional format and the summary the merge would have used:
         ```bash
         git commit -m "merge(ralph): <summary> (loop {loop_id})"
         ```

      5. Publish `conflict.resolved` to trigger test verification.

      ### If a conflict is unresolvable

      Some conflicts need a human: major architectural changes on both sides, conflicting refactors, or business-logic contradictions that require a decision. Publish `conflict.unresolvable` with why it cannot be resolved automatically, what decision is needed, and which files are affected.

  tester:
    name: "Test Verifier"
    description: "Runs test suite to verify merge didn't break anything."
    triggers: ["conflict.resolved"]
    publishes: ["tests.passed", "tests.failed"]
    effort: "medium"
    instructions: |
      ## TEST VERIFIER MODE

      Verify the resolved merge with the full test suite and a clean build:
      ```bash
      cargo test
      cargo build
      cargo clippy -- -D warnings
      ```

      Run every suite; clippy warnings count as failures. Publish `tests.passed` only if all of these pass. Otherwise publish `tests.failed` with which tests or checks failed, a short analysis of why, and a suggested fix approach.

  cleaner:
    name: "Worktree Cleaner"
    description: "Cleans up worktree and branch after successful merge."
    triggers: ["merge.done"]
    publishes: ["cleanup.done", "cleanup.failed"]
    effort: "medium"
    instructions: |
      ## WORKTREE CLEANER MODE

      Clean up the worktree and branch after a successful merge.

      ### Step 1: Get the loop ID

      Read it from RALPH_MERGE_LOOP_ID, or take it from context.

      Before removing anything, check the worktree for uncommitted changes. If there are any, investigate before force-removing, because `--force` discards them. Confirm the branch has the `ralph/` prefix before deleting it, so you never delete the wrong branch.

      ### Step 2: Remove the worktree

      ```bash
      git worktree remove .worktrees/{loop_id} --force
      ```

      ### Step 3: Delete the branch

      ```bash
      git branch -D ralph/{loop_id}
      ```

      ### Step 4: Prune refs

      ```bash
      git worktree prune
      ```

      ### Step 5: Update the merge queue

      Mark the loop as merged:
      ```bash
      ralph emit "merge.complete" --json '{"loop_id": "{loop_id}", "status": "merged"}'
      ```

      ### Step 6: Publish the result

      Publish `cleanup.done`. If any step fails, publish `cleanup.failed` with the error details.

  failure_handler:
    name: "Failure Handler"
    description: "Handles unresolvable conflicts and marks loop for review."
    triggers: ["conflict.unresolvable", "tests.failed", "merge.failed", "cleanup.failed"]
    publishes: []
    effort: "medium"
    instructions: |
      ## FAILURE HANDLER MODE

      Mark the loop for manual review and leave the repo in a clean state. Do not retry the merge yourself; a human decides what happens next.

      ### Step 1: Assess the failure

      - `conflict.unresolvable`: conflicts need a human decision.
      - `tests.failed`: the merge broke something.
      - `merge.failed`: the merge operation itself failed.
      - `cleanup.failed`: cleanup failed; the merge may have succeeded.

      ### Step 2: Abort the merge if one is in progress

      ```bash
      git merge --abort
      ```

      Do not leave the repo in a conflicted state.

      ### Step 3: Update the merge queue

      Mark the loop as needing review:
      ```bash
      ralph emit "merge.needs_review" --json '{"loop_id": "{loop_id}", "reason": "{failure_reason}"}'
      ```

      ### Step 4: Give resolution instructions

      Output instructions for manual resolution:

      ```
      ## Manual Resolution Required

      Loop {loop_id} could not be automatically merged.

      **Reason:** {detailed explanation}

      **To resolve:**
      1. cd .worktrees/{loop_id}
      2. Investigate the issue
      3. Make necessary changes
      4. Run: ralph loops retry {loop_id}

      **To discard:**
      Run: ralph loops discard {loop_id}
      ```

      Keep the worktree in place, because the user may need it to resolve the issue.
