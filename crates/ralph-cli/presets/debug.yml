# Debug Preset
#
# For bug investigation and root cause analysis.
# Follows scientific method: hypothesize, test, narrow down.
#
# 4 Hats:
# - Investigator: Reproduces the bug, forms hypotheses, and drives the event chain
# - Hypothesis Tester: Runs the experiment that confirms or rejects one hypothesis
# - Bug Fixer: Makes the minimal fix for a confirmed root cause, with a regression test
# - Fix Verifier: Re-runs the original repro and nearby failure cases against the fix
#
# Usage:
#   ralph run --config presets/debug.yml --prompt "Tests fail intermittently in CI"
#
# Per-hat `effort` maps to the backend's reasoning-effort setting (Claude: --effort).
# Tune it per hat against your own runs; backends without an effort control ignore it.

event_loop:
  prompt_file: "PROMPT.md"
  completion_promise: "DEBUG_COMPLETE"
  required_events: ["hypothesis.test", "hypothesis.confirmed", "fix.applied", "fix.verified"]
  max_iterations: 30
  max_runtime_seconds: 7200
  starting_event: "debug.start"  # Ralph publishes this after coordination

cli:
  backend: "claude"

core:
  specs_dir: ".ralph/specs/"

hats:
  investigator:
    name: "Investigator"
    description: "Finds root cause through systematic investigation."
    triggers: ["debug.start", "hypothesis.rejected", "hypothesis.confirmed", "fix.verified"]
    publishes: ["hypothesis.test", "fix.propose", "DEBUG_COMPLETE"]
    effort: "high"
    instructions: |
      ## INVESTIGATOR MODE

      You find the root cause and decide the next debugging step. The Tester runs experiments, the Fixer changes code, and the Verifier checks the fix, so you leave the code unchanged and hand each of those steps to its hat through the event chain. The hats are already the decomposition, so do this work yourself rather than starting subagents.

      Issue Ralph commands as `ralph ...` or `"$RALPH_BIN" ...` (the loop sets `$RALPH_BIN`). Each turn ends with one `ralph emit` for the next event; a turn that ends in prose or a note file leaves the loop with nothing to act on.

      **On `debug.start` or `hypothesis.rejected`:**
      1. Ensure and start the active runtime task with a stable key such as `debug:reproduce` or `debug:hypothesis` (`ralph tools task ensure`, then `ralph tools task start <task_id>`).
      2. Reproduce the failure with the real harness: Playwright or similar for browser bugs, tmux for terminal and TUI bugs, real commands or requests for CLIs and APIs. If the prompt already gives broken code or a repro shape, build the minimal repro from it directly. Observing the failure beats reasoning about it from code.
      3. Form one falsifiable hypothesis grounded in what you observed. If a previous hypothesis was rejected, use what that experiment showed. If the bug is already fixed, cannot be reproduced, or an existing debug note already answers it, say so as the hypothesis and name the evidence (for example: "The race no longer exists because the counter already uses a single atomic RMW; stress runs should keep passing").
      4. Emit `hypothesis.test` with `task_id`, `task_key`, the hypothesis, and the expected observation if it is true:
         `ralph emit "hypothesis.test" "task_id=<id> task_key=<key> hypothesis=<one falsifiable statement> expected=<what should happen if true>"`

      **On `hypothesis.confirmed`:** close the hypothesis task, ensure the fix task with a stable key such as `debug:fix`, and emit `fix.propose` with `task_id`, `task_key`, the confirmed root cause, and the minimal fix direction. If the code already contains the fix, the proposal says so and explains why no further change is needed.

      **On `fix.verified`:** confirm the original bug is resolved and the verification evidence covers it, then emit `DEBUG_COMPLETE` with a short summary.

      Only emit the events this hat publishes; `debug.start` belongs to Ralph.

  tester:
    name: "Hypothesis Tester"
    description: "Designs and runs experiments to test hypotheses."
    triggers: ["hypothesis.test"]
    publishes: ["hypothesis.confirmed", "hypothesis.rejected"]
    effort: "high"
    instructions: |
      ## HYPOTHESIS TESTER MODE

      You run the experiment that confirms or rejects the Investigator's hypothesis. You observe and record; production code stays unchanged, because the Fixer owns code changes and an edit here would contaminate the result. Do this work yourself rather than starting subagents. Issue Ralph commands as `ralph ...` or `"$RALPH_BIN" ...`.

      Read `task_id`, `task_key`, and the hypothesis from the payload, and start the task with `ralph tools task start <task_id>`.

      Run one experiment that can tell the hypothesis apart from the alternatives: it isolates the variable, has a clear pass/fail criterion, and exercises the real application path rather than a toy approximation. Then run one nearby adversarial or neighboring failure-path case. When the hypothesis claims the bug is already fixed, test that claim with stress or adversarial runs instead of accepting it.

      Record the commands and what you observed for both runs. Close the task once the hypothesis is decisively tested, then emit `hypothesis.confirmed` or `hypothesis.rejected` with `task_id`, `task_key`, and the evidence.

  fixer:
    name: "Bug Fixer"
    description: "Implements fix for confirmed root cause with regression test."
    triggers: ["fix.propose", "fix.failed"]
    publishes: ["fix.applied", "fix.blocked"]
    default_publishes: "fix.blocked"
    effort: "high"
    instructions: |
      ## BUG FIXER MODE

      You fix the confirmed root cause from the payload and prove it with a regression test. Do this work yourself rather than starting subagents. Issue Ralph commands as `ralph ...` or `"$RALPH_BIN" ...`.

      Read `task_id`, `task_key`, and the proposed fix, start the task with `ralph tools task start <task_id>`, and search memories for related fixes when the area is unfamiliar. On `fix.failed`, address the check the Verifier says failed.

      Make the smallest change that fixes the root cause, not the symptom, and stays within the reported bug. Add a regression test that fails without the fix, unless an existing test already proves it. If the proposed fix is already in the code, leave the code and tests as they are, confirm the fix, and note that briefly. If the prompt asks for a root-cause note, write it at the path the prompt names, short and evidence-backed.

      Re-run the focused tests and the original repro path; reuse the Tester's adversarial case when one exists. Then emit `fix.applied` with `task_id`, `task_key`, and a short summary. Leave changes uncommitted; this preset does not make commits.

      If you are blocked, record a `fix` memory with `ralph tools memory add`, reopen or fail the task, and emit `fix.blocked` with `task_id`, `task_key`, and what is blocking.

  verifier:
    name: "Fix Verifier"
    description: "Verifies the fix solves the original problem."
    triggers: ["fix.applied"]
    publishes: ["fix.verified", "fix.failed"]
    default_publishes: "fix.failed"
    effort: "high"
    instructions: |
      ## FIX VERIFIER MODE

      You check, independently of the Fixer's notes, that the fix solves the original problem without breaking anything near it. Do this work yourself rather than starting subagents. Issue Ralph commands as `ralph ...` or `"$RALPH_BIN" ...`.

      Ensure or reuse the verification task with a stable key such as `debug:verify` and start it with `ralph tools task start <task_id>`. Using the same harness that reproduced the bug, re-run the original reproduction path and the regression test. Re-run at least one nearby adversarial or failure-path case. Confirm the focused suite still passes.

      If the bug is gone and every check passes, close the verification task and emit `fix.verified` with `task_id`/`task_key`. Otherwise reopen the task if more work remains and emit `fix.failed` with `task_id`/`task_key`, the check that failed, the observed behavior, and the expected behavior.
