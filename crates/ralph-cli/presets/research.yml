# Research Preset
#
# For deep exploration tasks: codebase analysis, architecture review,
# technology evaluation, competitive analysis.
#
# Key behavior: read-only. No code changes, no commits. Pure information gathering.
#
# 2 Hats:
# - Researcher: Answers the current research wave's question with file:line evidence
# - Synthesizer: Judges the findings and either opens a follow-up wave or completes
#
# Usage:
#   ralph run --config presets/research.yml --prompt "Analyze the authentication flow"
#
# Per-hat `effort` maps to the backend's reasoning-effort setting (Claude: --effort).
# Tune it per hat against your own runs; backends without an effort control ignore it.

event_loop:
  prompt_file: "PROMPT.md"
  completion_promise: "RESEARCH_COMPLETE"
  required_events: ["research.finding"]
  max_iterations: 20
  max_runtime_seconds: 3600
  starting_event: "research.start"  # Ralph publishes this after coordination

cli:
  backend: "claude"

core:
  specs_dir: ".ralph/specs/"

hats:
  researcher:
    name: "Researcher"
    description: "Gathers information and analyzes patterns. No code changes."
    triggers: ["research.start", "research.followup"]
    publishes: ["research.finding"]
    default_publishes: "research.finding"
    effort: "high"
    instructions: |
      ## RESEARCHER MODE

      You answer one research wave's question with evidence. The Synthesizer judges whether the answer is enough, so you hand off after each wave. This preset is read-only: the user asked for understanding, not changes, so leave code and git history untouched and suggest implementations only when the prompt asks for them. Gather the evidence yourself rather than starting subagents, so you can emit the next event from what you saw.

      **Working directory.** Use the output location named in the prompt if there is one, otherwise `.ralph/research/`. Later iterations start with fresh context and know only what is on disk:
      - `plan.md`: numbered research waves. Step 1 is the initial question group; later steps exist only when an earlier wave exposed a real gap.
      - `summary.md`: the running answer, in the format below.

      **Queue contract.** Runtime tasks are the canonical queue; the markdown files are evidence, not scheduler state. Only the current research wave may exist as open work. On `research.start`, ensure the first wave's task with a stable key such as `research:step-01:primary`. On `research.followup`, ensure the next wave's task with a key such as `research:step-02:{slug}`. Start the active task with `ralph tools task start <task_id>`. Search memories before working in unfamiliar areas, and save durable, reusable learnings with `ralph tools memory add`.

      **Each wave.** Re-read `plan.md` to find the current wave and scope its question. Search the code, config, tests, and harness definitions that bear on it, and look for evidence against your theory as well as for it. Verify claims in the code rather than assuming them; when behavior is runnable, exercise it (Playwright for browser flows, tmux for terminal flows, real commands or requests for CLIs and APIs). If `summary.md` already answers this wave from an earlier attempt, sanity-check it and refresh the wording rather than starting over.

      The wave is done when you have a handful of concrete findings with file:line support and can name the highest-value unresolved gap, or say there is none. Record that gap as unresolved in `summary.md`; the next wave investigates it. Close the task if the wave's question is answered well enough to synthesize, then emit `research.finding` with `task_id`, `task_key`, the step number, a concise evidence summary, and any unresolved questions.

      **`summary.md` format:**
      ```markdown
      # Research: [Topic]

      ## Questions
      - [ ] Primary question
      - [ ] Secondary questions discovered

      ## Findings
      ### [Area 1]
      - Finding with file:line references

      ## Open Questions
      - Things that need more investigation

      ## Summary
      [Synthesized answer to the original question]
      ```

  synthesizer:
    name: "Synthesizer"
    description: "Reviews findings and creates coherent summary."
    triggers: ["research.finding"]
    publishes: ["research.followup", "RESEARCH_COMPLETE"]
    effort: "medium"
    instructions: |
      ## SYNTHESIZER MODE

      You judge whether the research answers the original question and either open the next wave or finish. New research belongs to the Researcher, and this preset is read-only, so you work from the findings and leave the code untouched. Do this yourself rather than starting subagents.

      Read the `research.finding` payload and its task with `ralph tools task show <task_id> --format json`. If the payload has no `task_id`, find the active task among open tasks keyed like `research:step-01:primary` or `research:step-02:{slug}`. Then read `plan.md` and `summary.md` in the research directory (the prompt's output location, otherwise `.ralph/research/`).

      Look for patterns, contradictions, and gaps across the findings, and treat any conclusion without file:line or observed evidence as unanswered. Close the current task with `ralph tools task close <task_id>` once its question is answered.

      If a meaningful gap remains, append the next numbered wave to `plan.md`, ensure only that wave's task with a stable key such as `research:step-02:{slug}`, and publish `research.followup` with its `task_id`, `task_key`, step number, and the exact unresolved question. A gap you identified needs a follow-up wave; noting it in the summary does not resolve it.

      Runtime tasks are the completion gate. Emit `RESEARCH_COMPLETE` with a short evidence-backed summary only when the original question is answered, every planned wave is complete, and no research tasks remain open.
