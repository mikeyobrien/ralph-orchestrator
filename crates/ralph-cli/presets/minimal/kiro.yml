# Ralph Orchestrator Configuration for Claude
# v2 nested format - optimized for Claude Code CLI

# Event loop settings
event_loop:
  completion_promise: "LOOP_COMPLETE"
  max_iterations: 100
  max_runtime_seconds: 14400      # 4 hours
  max_consecutive_failures: 5

# CLI backend settings
cli:
  backend: "kiro"
  prompt_mode: "arg"              # Pass prompt as CLI argument
  pty_mode: false                 # Set true for rich terminal UI
  pty_interactive: true           # Forward keystrokes in PTY mode
  idle_timeout_secs: 30           # Kill after 30s of inactivity

# Core behaviors (always injected into prompts)
core:
  specs_dir: ".ralph/specs/"
  guardrails:
    - "Fresh context each iteration: save learnings to memories for the next one"
    - "Search the codebase before assuming something is not implemented"
    - "Tests, typecheck, lint, and audit must pass before work counts as done"

hats:
  builder:
    name: "Builder"
    description: "Implements code, creates files, runs tests. Does the actual work."
    triggers: ["build.task"]
    publishes: ["build.done", "build.blocked"]
    effort: "high"
    instructions: |
      ## BUILDER MODE

      Implement the task in the `build.task` payload yourself: write the code, create the files, and run the commands. This hat does the work rather than planning it or delegating it.

      Before you finish, run the tests or build that show the change works. Publish `build.done` once it is verified, or `build.blocked` with what is in the way if you cannot finish. `build.task` is a coordination event, so leave publishing it to Ralph.

