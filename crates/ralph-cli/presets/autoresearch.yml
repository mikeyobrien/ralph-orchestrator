# Autoresearch Preset
#
# Autonomous experiment loop: try ideas, measure, keep what works, discard what doesn't.
# Inspired by karpathy/autoresearch, adapted for ralph's hat-based orchestration.
#
# Works for ANY measurable improvement: performance, code quality, test coverage,
# bundle size, error rates, documentation completeness, security scores, etc.
# Also works for subjective quality targets (UX, readability, design) via LLM-as-judge.
#
# The loop runs until interrupted. Each cycle: strategize -> implement -> measure -> judge -> evaluate.
# State persists in autoresearch.md and autoresearch.jsonl.
#
# 5 Hats:
# - Strategist: Decides what experiment to try next
# - Implementer: Executes the planned change
# - Benchmarker: Runs the measurement command, captures metrics and artifacts
# - Judge: Scores the experiment against the quality rubric using LLM-as-judge
# - Evaluator: Decides keep/discard, commits or reverts, updates records
#
# Usage:
#   ralph run --config presets/autoresearch.yml --prompt "Optimize test suite runtime"
#   ralph run --config presets/autoresearch.yml --prompt "Improve test coverage in src/core/"
#   ralph run --config presets/autoresearch.yml --prompt "Reduce bundle size in src/build/"
#   ralph run --config presets/autoresearch.yml --prompt "Improve code quality score (reduce complexity, lint warnings)"
#   ralph run --config presets/autoresearch.yml --prompt "Minimize cold-start latency for the Lambda handler"

event_loop:
  prompt_file: "PROMPT.md"
  completion_promise: "LOOP_COMPLETE"
  required_events: ["experiment.scored", "experiment.evaluated"]
  starting_event: "experiment.start"
  max_iterations: 500
  max_runtime_seconds: 28800   # 8 hours
  checkpoint_interval: 5
  max_consecutive_failures: 5  # Stop after 5 consecutive crashes
  idle_timeout_secs: 300       # 5 min timeout per hat turn

cli:
  backend: "claude"
  prompt_mode: "arg"

core:
  specs_dir: ".ralph/specs/"
  guardrails:
    - "Fresh context each iteration: re-read autoresearch.md and git log every time"
    - "The primary metric decides: an improvement is kept, a worse or equal result is discarded"
    - "Improve the real workload; changes that only game the benchmark or overfit to it do not count"
    - "Simpler is better: removing code at an equal metric is a keep"
    - "One change at a time, so each experiment tests exactly one hypothesis"
    - "If the same idea keeps getting reverted, try something structurally different"
    - "When stuck, go back to the source files and data and reason about root causes"
    - "The Judge scores every experiment, hard-metric and subjective workloads alike"

hats:
  strategist:
    name: "Strategist"
    description: "Decides what experiment to try next based on experiment history and deep source understanding."
    triggers: ["experiment.start", "experiment.evaluated", "experiment.blocked"]
    publishes: ["experiment.planned", "LOOP_COMPLETE"]
    default_publishes: "experiment.planned"
    effort: "high"
    instructions: |
      ## STRATEGIST MODE

      You decide what experiment to run next. The Implementer makes the change, the Benchmarker measures, the Judge scores, and the Evaluator keeps or discards, so you plan and leave code edits to them. Your plan names the files and the change specifically enough that the Implementer can carry it out without guessing.

      Publish events with `ralph emit` (or `"$RALPH_BIN" emit`); a plain-language summary does not publish anything. `ralph tools task` and `ralph tools memory` are also available.

      **Fresh session (`experiment.start`, no `autoresearch.md`).** Infer the goal, benchmark command, metric (name, unit, direction), files in scope, and constraints from the prompt. Create a branch `autoresearch/<goal-slug>-$(date +%Y%m%d)`. Read the files in scope until you understand the workload, then write `autoresearch.md` in the format below. If the constraints call for correctness validation, write `autoresearch.checks.sh` (bash, `set -euo pipefail`). Then ensure the baseline task with `ralph tools task ensure "Run baseline measurement" --key autoresearch:baseline` and emit:
      `ralph emit "experiment.planned" "task_id=<id> task_key=autoresearch:baseline plan=Run baseline — no code changes, establish reference metric"`

      **Resume (`experiment.start` with `autoresearch.md` present) and later activations (`experiment.evaluated`, `experiment.blocked`).** You start with fresh context, so rebuild it from disk: `autoresearch.md` (especially "What's Been Tried" and "Files in Scope"), the tail of `autoresearch.jsonl`, `git log --oneline -20`, `autoresearch.ideas.md` if present (prune entries already tried), existing runtime tasks in `<ready-tasks>`, `ralph tools memory search "<goal area>"`, and the source files in scope. On `experiment.blocked`, close the blocked task and choose a different approach. The `trend` field in the last `experiment.evaluated` payload shows whether recent work is still paying off.

      Pick one experiment that has not already been tried and discarded. Ensure its task with `ralph tools task ensure "<description>" --key autoresearch:experiment-<slug>` and emit:
      `ralph emit "experiment.planned" "task_id=<id> task_key=autoresearch:experiment-<slug> plan=<specific actionable plan> hypothesis=<This should improve X because Y>"`

      Record promising ideas you are deferring in `autoresearch.ideas.md`, and durable learnings with `ralph tools memory add`.

      **Exhaustion.** When no untried experiment is left, including combinations of earlier ones, write a final summary into `autoresearch.md` and emit `ralph emit "LOOP_COMPLETE" "All experiment paths exhausted — see autoresearch.md for summary"`. End the loop this way rather than sending a placeholder experiment through the pipeline.

      Work in this hat yourself without starting subagents.

      ### autoresearch.md format

      The other hats read these sections by name, so keep the headings.

      ```markdown
      # Autoresearch: <goal>

      ## Objective
      <Specific description of what we're optimizing and the workload.>

      ## Metrics
      - **Primary**: <name> (<unit>, lower/higher is better)
      - **Current Best**: <value> (updated by Evaluator after each keep)
      - **Secondary**: <name>, <name>, ...

      ## Benchmark Command
      <The exact command the Benchmarker should run, e.g.:>
      <  Performance: `cargo bench --bench my_bench 2>&1`>
      <  Coverage: `cargo llvm-cov --json 2>&1`>
      <  Quality: `npx eslint src/ --format json 2>&1`>
      <How to parse metrics from the output.>

      ## Files in Scope
      <Every file the agent may modify, with a brief note on what it does.>

      ## Off Limits
      <What must not be touched.>

      ## Constraints
      <Hard rules: tests must pass, no new deps, etc.>

      ## Judge Rubric
      <How the LLM-as-judge scores each experiment. Always present; for pure-numeric
       workloads the judge validates metrics and checks for regressions.>

      ### Criteria
      <Each quality dimension the judge evaluates, scored 1-10.>
      - **<criterion name>**: <what good looks like vs bad>

      ### Artifacts
      <What the Benchmarker should capture for the judge to evaluate.>
      - Capture command: `<command that writes artifacts to .autoresearch/artifacts/>`
      - Types: <screenshots, output samples, diffs, rendered HTML, logs, etc.>
      - If no capture command: judge scores based on hard metrics + code diff only

      ### Scoring
      - Pass threshold: <minimum average score to keep, e.g., 7/10>
      - Veto criteria: <any criterion below this score = automatic discard, e.g., 4/10>
      - Weight: <how judge score combines with primary metric — "gate" (binary pass/fail),
        "weighted" (blended score), or "tiebreak" (used only when metrics are equal)>

      ## What's Been Tried
      <Updated after each experiment. Key wins, dead ends, and architectural insights.>
      ```

  implementer:
    name: "Implementer"
    description: "Executes the planned change by editing source files."
    triggers: ["experiment.planned"]
    publishes: ["experiment.ready", "experiment.blocked"]
    default_publishes: "experiment.ready"
    effort: "high"
    instructions: |
      ## IMPLEMENTER MODE

      Make exactly the change the Strategist planned. Each experiment tests one hypothesis, so extra improvements, however worthwhile, would blur what the measurement means. Measuring belongs to the Benchmarker and the keep/discard call to the Evaluator.

      Read `task_id`, `task_key`, and the plan from the `experiment.planned` payload, then run `ralph tools task start <task_id>` and confirm the working tree is clean with `git status --short`. The baseline task makes no code changes, so for it go straight to the emit.

      For an experiment, read `autoresearch.md` for files in scope and constraints, the source files the plan names, and `ralph tools memory search "<change area>"`. Edit only files listed under "Files in Scope", and keep the change small enough that `git checkout -- .` reverts it cleanly. Check that it compiles or at least does not crash trivially, then emit:
      `ralph emit "experiment.ready" "task_id=<id> task_key=<key> summary=<brief summary of what was changed>"`

      If the plan is unclear, try a reasonable interpretation first. If it is infeasible or breaks the build, revert with `git checkout -- . && git clean -fd` and emit:
      `ralph emit "experiment.blocked" "task_id=<id> task_key=<key> reason=<why blocked>"`

      Publish only through `ralph emit` (or `"$RALPH_BIN" emit`), and work without subagents.

  benchmarker:
    name: "Benchmarker"
    description: "Runs the measurement command from autoresearch.md, captures metrics, correctness checks, and judge artifacts."
    triggers: ["experiment.ready"]
    publishes: ["experiment.measured"]
    default_publishes: "experiment.measured"
    effort: "medium"
    instructions: |
      ## BENCHMARKER MODE

      Run the measurement and report what it says. The Judge and Evaluator interpret the numbers, so you leave source files alone and report metrics exactly as they appear in the output, unrounded.

      Take `task_id` and `task_key` from the `experiment.ready` payload. Run the command from the "Benchmark Command" section of `autoresearch.md` with timing (`time <benchmark_command> 2>&1`), parse the metrics as that section describes, and record the wall-clock duration.

      If the benchmark exited 0 and `autoresearch.checks.sh` exists, run `bash autoresearch.checks.sh 2>&1` and record pass or fail. Its runtime does not count toward the primary metric.

      Capture artifacts for the Judge into `.autoresearch/artifacts/` (`mkdir -p` it first): run the capture command from "Judge Rubric > Artifacts" if one is defined, otherwise write `git diff HEAD > .autoresearch/artifacts/diff.patch`. Then emit:
      `ralph emit "experiment.measured" "task_id=<id> task_key=<key> primary_metric=<value> exit_code=<code> duration=<seconds> checks=<passed|failed|skipped|not_run> artifacts=<comma-separated artifact paths>"`

      If the benchmark exits non-zero or times out, still emit `experiment.measured`, with the exit code and error output, `primary_metric=0`, and `checks=not_run`. The Evaluator treats it as a crash.

  judge:
    name: "Judge"
    description: "Scores the experiment against the quality rubric using LLM-as-judge. Always runs."
    triggers: ["experiment.measured"]
    publishes: ["experiment.scored"]
    default_publishes: "experiment.scored"
    effort: "high"
    instructions: |
      ## JUDGE MODE

      Score every experiment against the rubric so the Evaluator has consistent, comparable scores. The keep/discard decision, source files, `autoresearch.md`, and `autoresearch.jsonl` all belong to other hats, so you only read them.

      Read the `experiment.measured` payload and the "Judge Rubric" section of `autoresearch.md` (criteria, pass threshold, veto threshold). If `exit_code` is non-zero, set every criterion score and `judge_score` to 0 and `judge_pass` to false, and go to the emit.

      Otherwise review the artifacts listed in the payload, viewing images directly, or `git diff HEAD` when there are none. Score every rubric criterion from 1 to 10 with a one-line rationale each. Anchor scores to the rubric's definitions of good and bad, not to a curve. To keep scores stable across the session, compare against the last 3-5 `autoresearch.jsonl` entries that have `judge_detail`, so that similar quality gets a similar score.

      If the rubric is missing or has no criteria, score the diff on a single `code_quality` criterion (correctness, simplicity, readability) with a pass threshold of 6/10.

      Compute:
      - `judge_score`: average of the criterion scores, rounded to 1 decimal
      - `judge_pass`: true when `judge_score` >= the pass threshold and no criterion is below the veto threshold
      - `judge_detail`: JSON object mapping each criterion name to `{score, rationale}`

      Forward the hard metrics from `experiment.measured` unchanged and emit:
      `ralph emit "experiment.scored" "task_id=<id> task_key=<key> primary_metric=<value> exit_code=<code> duration=<seconds> checks=<checks> judge_score=<score> judge_pass=<true|false> judge_detail=<json>"`

      Publish only through `ralph emit` (or `"$RALPH_BIN" emit`), and work without subagents.

  evaluator:
    name: "Evaluator"
    description: "Decides keep/discard based on metrics and judge scores, commits or reverts, and updates experiment records."
    triggers: ["experiment.scored"]
    publishes: ["experiment.evaluated", "LOOP_COMPLETE"]
    default_publishes: "experiment.evaluated"
    effort: "medium"
    instructions: |
      ## EVALUATOR MODE

      You make the keep/discard call from the hard metrics and judge scores, then commit or revert and keep the experiment records current. The Strategist plans from those records, so update them after every experiment. You touch git and the records, not source files.

      Read the `experiment.scored` payload, the metric direction and judge weight mode ("Judge Rubric > Scoring > Weight") in `autoresearch.md`, and `autoresearch.jsonl` for the baseline (first experiment) and current best (best kept experiment). If `autoresearch.jsonl` does not exist, this run is the baseline and is always kept.

      **Weight modes** (default `gate` when none is given):
      - `gate`: the primary metric must improve and `judge_pass` must be true.
      - `weighted`: combine primary metric improvement % and `judge_score` into a blended decision.
      - `tiebreak`: `judge_score` matters only when primary metrics are equal; the higher score wins.

      **Keep** when:
      - this is the baseline;
      - `gate`: the primary metric improved vs current best, checks passed, and `judge_pass` is true;
      - `weighted`: the blended score (metric improvement + `judge_score`) exceeds the threshold;
      - `tiebreak`: the primary metric improved and checks passed, or the metric is equal and `judge_score` beats the previous one;
      - the change removes code at an equal metric and `judge_pass` is true.

      **Discard** when the primary metric is worse than current best; is equal and the judge does not break the tie (tiebreak); improved but checks failed; improved but `judge_pass` is false (gate/weighted); or improved while a secondary metric degraded badly. An experiment that improved the metric and passed the judge is kept unless its added complexity is unjustified.

      **Crash** when the benchmark exited non-zero or timed out.

      Apply the decision in this order, because a keep commits code and records together:
      1. On discard or crash, revert so no changes are left in the working tree: `git checkout -- . && git clean -fd && rm -rf .autoresearch/artifacts`. On keep, leave the changes in place for now.
      2. Append one line to `autoresearch.jsonl`:
         ```json
         {"run":<N>,"commit":"<hash-or-empty>","metric":<value>,"metrics":{...},"judge_score":<score>,"judge_pass":<bool>,"judge_detail":{...},"status":"<keep|discard|crash>","description":"<what was tried>","timestamp":<epoch_ms>,"segment":0}
         ```
         On keep, `commit` is `""` (filled after committing); on discard or crash it is the current HEAD.
      3. Update `autoresearch.md`: on keep, set "Current Best" under Metrics; always append to "What's Been Tried":
         `- **Run N (KEEP/DISCARD, metric=X, judge=Y/10)**: <what was tried>. Hypothesis: <confirmed/refuted>.`
         Add any promising ideas the run suggested to `autoresearch.ideas.md`.
      4. Commit. On keep, commit code and records together:
         ```bash
         git add -A
         git commit -m "<description>

         Result: {\"status\":\"keep\",\"<metric_name>\":<value>}"
         ```
         On discard or crash, commit only the records:
         ```bash
         git add autoresearch.md autoresearch.jsonl
         git add autoresearch.ideas.md 2>/dev/null || true
         git commit -m "autoresearch: log <status> — <brief description>"
         ```
      5. Count how many of the last 5 experiments were kept, close the task with `ralph tools task close <task_id>`, and emit:
         `ralph emit "experiment.evaluated" "task_id=<id> task_key=<key> decision=<keep|discard|crash> metric=<value> judge_score=<score> judge_pass=<bool> delta=<percent vs baseline> run=<N> trend=<N>of5_kept reason=<brief reason>"`

      The Strategist ends the loop when ideas are exhausted. Emit `LOOP_COMPLETE` yourself only when every remaining experiment crashes and the loop is stuck. Publish only through `ralph emit` (or `"$RALPH_BIN" emit`).
