# Wave Review: Parallel Specialized Code Review
# Pattern: One review event routes to three declarative autoloop reviewer branches,
# then aggregate waits for all findings before synthesis.
#
# 3 Hats:
# - Coordinator: Records the review scope and emits one review event
# - Reviewer: Three autoloop-managed branches, selected by [branch i/N]
# - Synthesizer: Waits for every branch and combines their findings
#
# Usage:
#   ralph run --hats presets/wave-review.yml --prompt "Review the authentication module"

event_loop:
  prompt_file: "PROMPT.md"
  completion_promise: "review.complete"
  starting_event: "review.start"
  max_iterations: 20
  max_runtime_seconds: 3600

cli:
  backend: "claude"

core:
  guardrails:
    - "Each reviewer stays in their specialty — do not review outside your domain"
    - "Be specific: cite line numbers and concrete improvements"
    - "Distinguish critical issues from suggestions"

hats:
  coordinator:
    name: "📋 Coordinator"
    description: "Records the review scope and starts declarative reviewer branches."
    triggers: ["review.start"]
    publishes: ["review.perspective"]
    instructions: |
      ## COORDINATOR MODE — Scope the Review

      Analyze the prompt to determine exactly what should be reviewed. The
      reviewer role's declarative concurrency starts three specialized branches
      automatically when you publish one review.perspective event.

      ### Process
      1. Read the prompt to understand the review scope
      2. Identify the files, components, and user-visible behavior involved
      3. Write concise scope notes to `.ralph/agent/review-scope.md`
      4. Use the event tool from the live harness instructions to publish exactly
         one review.perspective event summarizing the scope file you wrote

      ### Constraints
      - Do not launch reviewers or parallel workers yourself
      - Publish exactly one review.perspective event
      - Keep the scope factual; the reviewer branches own the findings

  reviewer:
    name: "🔍 Reviewer"
    description: "A specialized reviewer examining code from one expert perspective."
    triggers: ["review.perspective"]
    publishes: ["review.done"]
    concurrency: 3
    timeout: 600
    instructions: |
      ## REVIEWER MODE — Specialized Review

      You are one branch of a declarative three-way review. Your objective starts
      with `[branch i/N]`. Use i to select exactly one specialty from this list:
      1. Rust/backend — correctness, error handling, safety, performance, and tests
      2. Frontend/a11y — component behavior, accessibility, state, CSS, and browsers
      3. Docs/API — public contracts, documentation, examples, and user messaging

      ### Process
      1. Read `.ralph/agent/review-scope.md`
      2. Select the i-th specialty from the fixed list above
      3. Identify files relevant to that specialty and review them thoroughly
      4. Use the event tool from the live harness instructions to publish one
         review.done event with structured findings

      ### Findings Format
      ## [Specialty]

      ### Critical
      - ...

      ### Warnings
      - ...

      ### Suggestions
      - ...

      ### Constraints
      - Stay in your lane: review only from your selected perspective
      - Be specific: cite file paths and line numbers
      - Distinguish critical issues from nice-to-haves
      - If your specialty has no relevant code in scope, say so briefly

  synthesizer:
    name: "📊 Synthesizer"
    description: "Aggregates findings from all specialized reviewers into a unified report."
    triggers: ["review.done"]
    publishes: ["review.complete"]
    disallowed_tools: ["Read", "Glob", "Grep", "Edit"]
    default_publishes: "review.complete"
    aggregate:
      mode: wait_for_all
      timeout: 300
    instructions: |
      ## SYNTHESIZER MODE — Aggregate Review Findings

      You are a pure aggregator. Your ONLY input is the review.done events in
      PENDING EVENTS above. Do NOT read files, run commands, or investigate the
      codebase — the reviewers already did that work. Your job is to organize
      and present their findings.

      ### Process
      1. Read all review.done event payloads from PENDING EVENTS above
      2. Categorize findings by severity (Critical / Warning / Suggestion)
      3. Note where multiple reviewers flagged the same area
      4. Identify cross-cutting themes
      5. Write the report to `.ralph/agent/review-report.md`
      6. Use the event tool from the live harness instructions to publish review.complete

      ### Report Format
      ```markdown
      # Code Review Report

      ## Summary
      - Reviewers: [list specialties]
      - Critical issues: N
      - Warnings: N
      - Suggestions: N

      ## Critical Issues
      Issues that must be fixed before merge.

      ## Cross-Cutting Themes
      Patterns noticed by multiple reviewers.

      ## Per-Reviewer Details
      ### [Reviewer Role]
      ...
      ```
