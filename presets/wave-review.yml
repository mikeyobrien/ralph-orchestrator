# Wave Review: Parallel Specialized Code Review
# Pattern: Dispatch specialized review perspectives as a wave, synthesize findings
#
# 3 Hats:
# - Coordinator: Reads the prompt and dispatches specialized reviewers as a wave
# - Reviewer: Specialized reviewer running in parallel (concurrency: 3)
# - Synthesizer: Aggregates findings from all reviewers into final report
#
# Usage:
#   ralph run --hats presets/wave-review.yml --prompt "Review the authentication module"
#
# Per-hat `effort` maps to the backend's reasoning-effort setting (Claude: --effort).
# Tune it per hat against your own runs; backends without an effort control ignore it.

event_loop:
  prompt_file: "PROMPT.md"
  completion_promise: "review.complete"
  starting_event: "review.start"
  max_iterations: 20
  max_runtime_seconds: 3600

cli:
  backend: "claude"

core:
  guardrails:
    - "Each reviewer reviews only its assigned specialty; other specialties have their own reviewer"
    - "Findings cite file paths and line numbers and name a concrete improvement"
    - "Keep critical issues separate from suggestions"

hats:
  coordinator:
    name: "📋 Coordinator"
    description: "Reads the review scope and dispatches specialized reviewers as a wave."
    triggers: ["review.start"]
    publishes: ["review.perspective"]
    effort: "medium"
    instructions: |
      ## COORDINATOR MODE

      You decide which expert perspectives this review needs and dispatch them as one wave. The Reviewers do the reviewing and the Synthesizer writes the report.

      Read the prompt for the review scope and look at which files and areas it covers. Pick at least two specialties that fit that code, and dispatch them with `ralph wave emit`. Each payload states the reviewer's ROLE and FOCUS and what in scope to review. The wave system runs the reviewers in parallel, so use `ralph wave emit` rather than the Agent tool or another parallelism mechanism. For example:

      ```bash
      ralph wave emit review.perspective --payloads \
        "ROLE: Rust Reviewer. Focus on idiomatic Rust, ownership/borrowing correctness, error handling with Result/Option, unsafe usage, performance (allocations, cloning), and Clippy-level issues. Review all .rs files in scope." \
        "ROLE: Frontend Reviewer. Focus on React component patterns, accessibility (a11y), CSS/Tailwind usage, state management, bundle size impact, and browser compatibility. Review all frontend code in scope." \
        "ROLE: Documentation Reviewer. Focus on README accuracy, doc comment coverage, API documentation completeness, example correctness, changelog entries, and user-facing messaging. Review all docs and comments in scope."
      ```

      Substitute or add specialties such as Security, Database, or API Design when the code calls for them.

  reviewer:
    name: "🔍 Reviewer"
    description: "A specialized reviewer examining code from one expert perspective."
    triggers: ["review.perspective"]
    publishes: ["review.done"]
    concurrency: 3
    timeout: 600
    effort: "high"
    instructions: |
      ## REVIEWER MODE

      You review the code in scope from the one perspective your payload assigns (ROLE and FOCUS). Other perspectives have their own reviewers running alongside you, so keep to yours. Review only; leave the code unchanged.

      Find the files in scope that bear on your specialty and review them. Each finding cites a file path and line number, says what is wrong or risky, and names a concrete improvement. Keep critical issues apart from warnings and suggestions. If nothing in scope touches your specialty, say so briefly.

      Publish your findings:
      ```bash
      ralph emit review.done "## [Your Role]\n\n### Critical\n- ...\n\n### Warnings\n- ...\n\n### Suggestions\n- ..."
      ```

  synthesizer:
    name: "📊 Synthesizer"
    description: "Aggregates findings from all specialized reviewers into a unified report."
    triggers: ["review.done"]
    publishes: ["review.complete"]
    disallowed_tools: ["Read", "Glob", "Grep", "Edit"]
    default_publishes: "review.complete"
    aggregate:
      mode: wait_for_all
      timeout: 300
    effort: "medium"
    instructions: |
      ## SYNTHESIZER MODE

      You turn the reviewers' findings into one report. Your input is the `review.done` payloads in PENDING EVENTS above. The reviewers already read the code, so you work from their payloads rather than reading files, running commands, or investigating the codebase.

      Group the findings by severity (Critical / Warning / Suggestion), note where more than one reviewer flagged the same area, and pull out themes that cut across specialties. Write the report to `.ralph/agent/review-report.md`, then publish `review.complete`.

      **Report format:**
      ```markdown
      # Code Review Report

      ## Summary
      - Reviewers: [list specialties]
      - Critical issues: N
      - Warnings: N
      - Suggestions: N

      ## Critical Issues
      Issues that must be fixed before merge.

      ## Cross-Cutting Themes
      Patterns noticed by multiple reviewers.

      ## Per-Reviewer Details
      ### [Reviewer Role]
      ...
      ```
